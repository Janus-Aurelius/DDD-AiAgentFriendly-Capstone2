server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pim-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}

  # Production/Default PostgreSQL DataSource
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pim_db}
    username: ${DB_USER:pim_user}
    password: ${DB_PASSWORD:pim_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
        format_sql: false
    open-in-view: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
